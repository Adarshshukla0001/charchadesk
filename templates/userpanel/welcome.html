{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharchaDesk</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

/* 🌌 Smooth Gradient */
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #020617, #0f172a, #020617);
    overflow: hidden;
}

/* 🌠 Soft Glow Background */
.bg-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(56,189,248,0.15), transparent 70%);
    top: -100px;
    left: -100px;
    animation: moveGlow 10s infinite alternate ease-in-out;
}

@keyframes moveGlow {
    from { transform: translate(0,0); }
    to { transform: translate(200px,150px); }
}

/* ✨ Card */
.card {
    backdrop-filter: blur(18px);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

/* 🔥 Logo pulse */
.pulse {
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%,100%{transform: scale(1)}
    50%{transform: scale(1.08)}
}

/* ⌨️ Typing */
.cursor::after {
    content: "|";
    animation: blink 1s infinite;
}
@keyframes blink {
    0%,100%{opacity:0}
    50%{opacity:1}
}

/* ⚡ Loader */
.loader {
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
}
.loader-bar {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg,#22d3ee,#60a5fa,#fbbf24);
    transition: width 0.25s ease;
}

/* 💡 Shine Effect */
.shine {
    position: relative;
    overflow: hidden;
}
.shine::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shineMove 3s infinite;
}
@keyframes shineMove {
    0% { left: -100% }
    100% { left: 200% }
}

</style>
</head>

<body class="flex items-center justify-center min-h-screen">

<div class="bg-glow"></div>

<!-- 💎 CARD -->
<div class="card shine p-10 rounded-3xl text-center w-full max-w-xl relative z-10">

    <!-- ⚡ Logo -->
    <div class="text-5xl mb-6 pulse">⚡</div>

    <!-- 🧠 Text -->
    <h1 id="text" class="text-3xl md:text-4xl font-bold text-cyan-300 cursor"></h1>

    <p class="mt-4 text-gray-400 text-lg">
        Welcome to <span class="text-cyan-400 font-semibold">CharchaDesk</span>
    </p>

    <!-- ⚡ Loader -->
    <div class="loader mt-8">
        <div id="bar" class="loader-bar"></div>
    </div>

    <p id="percent" class="text-sm mt-2 text-gray-500">0%</p>

</div>

<audio id="audio" src="{% static 'userpanel/welcome_voice.mp3' %}"></audio>

<script>

/* 🧠 CLEAN TYPING (no delete = more premium) */
const message = "Initializing your workspace...";
let index = 0;

function type(){
    if(index < message.length){
        document.getElementById("text").innerHTML += message[index++];
        setTimeout(type, 50);
    }
}
type();

/* ⚡ SMOOTH LOADING */
let progress = 0;
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");

let loader = setInterval(()=>{
    progress += 2 + Math.random()*3;

    if(progress >= 100){
        progress = 100;
        clearInterval(loader);

        // slight pause before redirect
        setTimeout(()=>{
            window.location.href="/dashboard/";
        },800);
    }

    bar.style.width = progress + "%";
    percent.innerText = Math.floor(progress) + "%";

},120);

/* 🔊 AUDIO (premium handling) */
const audio = document.getElementById("audio");

window.onload = ()=>{
    audio.play().catch(()=>{
        document.body.addEventListener("click", ()=>audio.play(), {once:true});
    });
};

</script>

</body>
</html>
