<h2>Admin Login</h2>

<form method="post">
    {% csrf_token %}
    <input type="text" name="admin_id" placeholder="Admin ID"><br>
    <input type="password" name="password" placeholder="Password"><br>
    <button type="submit">Login</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
